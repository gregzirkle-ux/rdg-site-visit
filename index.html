<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Site Visit">
<meta name="theme-color" content="#a12b2a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RDG Site Visit</title>
<style>
  :root{ --red:#a12b2a; --ink:#101010; --paper:#f6f5f3; --line:rgba(255,255,255,.28); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font:400 16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}

  #camwrap{position:fixed;inset:0;overflow:hidden;background:#000}
  #cam{width:100%;height:100%;object-fit:cover;transform-origin:center center;
    transition:transform .12s ease-out;display:block}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .09s}
  #flash.on{opacity:.75;transition:none}

  .topbar{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display:flex;align-items:center;gap:8px;z-index:5;
    background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
  .chip{border:1px solid var(--line);background:rgba(0,0,0,.38);color:#fff;
    padding:7px 12px;border-radius:100px;font-size:13px;backdrop-filter:blur(8px);
    max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:active{background:rgba(255,255,255,.2)}
  .count{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;white-space:nowrap}
  .count b{font-size:19px;font-weight:600}

  .zoomrow{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 158px);
    display:flex;justify-content:center;gap:9px;z-index:5}
  .zchip{width:44px;height:36px;border-radius:100px;border:1px solid var(--line);
    background:rgba(0,0,0,.42);color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(8px)}
  .zchip.on{background:#fff;color:var(--red);border-color:#fff}

  .dock{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:5;
    padding:0 22px calc(env(safe-area-inset-bottom) + 14px);
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(0deg,rgba(0,0,0,.66),rgba(0,0,0,0))}
  #thumb{width:54px;height:54px;border-radius:11px;border:1.5px solid var(--line);
    background:#222 center/cover no-repeat;position:relative;flex:0 0 auto}
  #thumb.empty{opacity:.32}
  #thumb .badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;
    background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px}
  #shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:5px solid var(--red);
    box-shadow:0 0 0 3px rgba(0,0,0,.35);flex:0 0 auto}
  #shutter:active{transform:scale(.93)}
  #shutter.busy{background:#ddd}
  #undo{width:54px;height:54px;flex:0 0 auto;border:1px solid var(--line);background:rgba(0,0,0,.35);
    color:#fff;border-radius:11px;font-size:12px;backdrop-filter:blur(8px);opacity:0;
    transition:opacity .18s;pointer-events:none}
  #undo.show{opacity:1;pointer-events:auto}

  .stall{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 205px);
    background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;
    font-weight:600;display:none;z-index:6}
  .stall.show{display:block}

  .sheet{position:fixed;inset:0;background:var(--paper);color:var(--ink);
    transform:translateY(100%);transition:transform .22s ease;overflow-y:auto;
    -webkit-overflow-scrolling:touch;z-index:20;touch-action:auto}
  .sheet.open{transform:translateY(0)}
  .sheethead{position:sticky;top:0;background:var(--paper);z-index:2;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;border-bottom:1px solid #dedbd6}
  .sheethead h2{margin:0;font-size:17px;font-weight:650;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .btn{border:0;background:none;color:var(--red);font-size:16px;font-weight:600;padding:6px 2px;
    white-space:nowrap}
  .btn.right{margin-left:auto}
  .btn[disabled]{opacity:.35}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
  .cell{position:relative;aspect-ratio:1;background:#ddd center/cover no-repeat;border:0;padding:0}
  .cell .t{position:absolute;left:0;right:0;bottom:0;padding:4px 5px;font-size:10.5px;color:#fff;
    background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);font-variant-numeric:tabular-nums}
  .cell .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;
    font-size:10.5px;padding:2px 5px;border-radius:4px}
  .cell.noted:after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;
    border-radius:50%;background:var(--red);box-shadow:0 0 0 1.5px #fff}

  .pad{padding:16px}
  .shot{width:100%;border-radius:10px;display:block;background:#ddd}
  .meta{font-size:13px;color:#6b6560;margin:10px 0 16px;font-variant-numeric:tabular-nums}
  textarea{width:100%;min-height:130px;border:1px solid #d5d1cb;border-radius:10px;padding:12px;
    font:inherit;background:#fff;color:var(--ink);resize:none}
  .lbl{font-size:12px;font-weight:700;letter-spacing:.9px;color:#7a736c;margin:18px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .tag{border:1px solid #d5d1cb;background:#fff;color:#3c3733;padding:9px 14px;border-radius:100px;font-size:14.5px}
  .tag.on{background:var(--red);border-color:var(--red);color:#fff}
  .danger{color:var(--red);border:1px solid #e3d4d3;background:#fff;width:100%;
    padding:14px;border-radius:10px;font:inherit;font-weight:600;margin:26px 0 40px}
  .primary{background:var(--red);color:#fff;border:0;width:100%;padding:16px;border-radius:10px;
    font:inherit;font-weight:650;font-size:16px}
  .ghost{background:#fff;color:var(--ink);border:1px solid #d5d1cb;width:100%;padding:14px;
    border-radius:10px;font:inherit;font-weight:600;margin-top:10px}
  input[type=text]{width:100%;border:1px solid #d5d1cb;border-radius:10px;padding:13px;
    font:inherit;background:#fff;color:var(--ink);margin-bottom:10px}
  .empty{padding:60px 30px;text-align:center;color:#8a837c;font-size:15px}
  .auto{font-size:12.5px;color:#8a837c;margin:-4px 0 14px}

  .areasheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);
    border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(110%);transition:transform .2s ease;z-index:25;touch-action:auto}
  .areasheet.open{transform:translateY(0)}
  .areasheet .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .areasheet h3{margin:0;font-size:16px;font-weight:650}
  .recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:24}
  .scrim.open{opacity:1;pointer-events:auto}

  .start{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:30;
    display:flex;flex-direction:column;justify-content:center;
    padding:28px calc(28px + env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom))}
  .start.hide{display:none}
  .start .brand{font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--red)}
  .start h1{margin:6px 0 22px;font-size:34px;font-weight:700;letter-spacing:-.5px}
  .start .line{display:flex;justify-content:space-between;padding:11px 0;
    border-bottom:1px solid #e2dfda;font-size:15px}
  .start .line span:first-child{color:#7a736c}
  .start .actions{margin-top:26px}
  .busywrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;
    z-index:60;text-align:center;padding:30px;backdrop-filter:blur(3px)}
  .busywrap.show{display:grid}
  .busywrap div{font-size:15px}
</style>
</head>
<body>

<div id="camwrap"><video id="cam" playsinline autoplay muted></video></div>
<div id="flash"></div>

<div class="topbar">
  <button class="chip" id="projBtn">Visit info</button>
  <button class="chip" id="areaBtn">Set area</button>
  <button class="chip" id="finishBtn" style="margin-left:auto;border-color:#fff">Finish</button>
</div>

<button class="stall" id="stall">Camera stalled. Tap to restart.</button>
<div class="zoomrow" id="zoomRow"></div>

<div class="dock">
  <button id="thumb" class="empty" aria-label="Review photos"></button>
  <button id="shutter" aria-label="Take photo"></button>
  <button id="undo">Undo</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="areasheet" id="areaSheet">
  <div class="row">
    <h3>Area</h3>
    <button class="btn right" id="areaDone">Done</button>
  </div>
  <input type="text" id="areaInput" placeholder="Level 2, Exterior, Mech Room" autocomplete="off">
  <div class="recent" id="areaRecent"></div>
</div>

<!-- visit info -->
<section class="sheet" id="vis">
  <div class="sheethead">
    <button class="btn" id="visClose">Camera</button>
    <h2>Visit info</h2>
    <button class="btn right" id="visSave">Save</button>
  </div>
  <div class="pad">
    <div class="lbl">PROJECT</div>
    <input type="text" id="vProject" placeholder="Project name">
    <input type="text" id="vNum" placeholder="Project number">
    <div class="lbl">PRESENT</div>
    <input type="text" id="vAtt" placeholder="Who you walked with">
    <div class="lbl">PREPARED BY</div>
    <input type="text" id="vBy" placeholder="Your name">
    <div class="lbl">WEATHER</div>
    <input type="text" id="vWx" placeholder="Fetched automatically">
    <input type="text" id="vTemp" placeholder="Temperature">
    <div class="auto" id="vAuto"></div>
    <button class="ghost" id="vNew">End this visit and go back</button>
  </div>
</section>

<!-- gallery -->
<section class="sheet" id="gal">
  <div class="sheethead">
    <button class="btn" id="galClose">Camera</button>
    <h2 id="galTitle">Visit</h2>
    <button class="btn right" id="galExport">Export</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="galEmpty" style="display:none">No photos yet.</div>
  <div class="pad">
    <button class="primary" id="galBuild">Build the report</button>
    <button class="ghost" id="galBack">Keep shooting</button>
  </div>
</section>

<!-- detail -->
<section class="sheet" id="det">
  <div class="sheethead">
    <button class="btn" id="detClose">Back</button>
    <h2 id="detTitle">Observation</h2>
    <button class="btn right" id="detSave">Save</button>
  </div>
  <div class="pad">
    <img class="shot" id="detImg" alt="">
    <div class="meta" id="detMeta"></div>
    <div class="lbl">NOTE</div>
    <textarea id="detNote" placeholder="Tap the microphone on your keyboard and talk."></textarea>
    <div class="lbl">TAG</div>
    <div class="chips" id="tagRow"></div>
    <div class="lbl">AREA</div>
    <input type="text" id="detArea" placeholder="Level 2, Exterior, Mech Room">
    <div class="lbl">SHEET OR ROOM</div>
    <input type="text" id="detSheet" placeholder="A2.01, Room 214">
    <div id="actionBits" style="display:none">
      <div class="lbl">OWNER</div>
      <input type="text" id="detOwner" placeholder="Who owns it">
      <div class="lbl">DUE</div>
      <div class="chips" id="dueRow"></div>
    </div>
    <button class="danger" id="detDel">Delete this photo</button>
  </div>
</section>

<!-- report ready -->
<section class="sheet" id="done">
  <div class="sheethead">
    <button class="btn" id="doneClose">Back</button>
    <h2>Report ready</h2>
  </div>
  <div class="pad">
    <div class="lbl">FILE</div>
    <div id="doneName" style="font-size:15px;word-break:break-all"></div>
    <div class="auto" id="doneNote" style="margin-top:8px"></div>
    <button class="primary" id="doneShare">Email or share</button>
    <button class="ghost" id="doneSave">Save to Files</button>
  </div>
</section>

<section class="start" id="start">
  <div class="brand">REDLINE DESIGN GROUP</div>
  <h1>Site Visit</h1>
  <div class="line"><span>Project</span><span id="sProject">Not set</span></div>
  <div class="line"><span>Report</span><span id="sNum">SVR 001</span></div>
  <div class="line"><span>Date</span><span id="sDate"></span></div>
  <div class="line"><span>Build</span><span id="sBuild"></span></div>
  <div class="actions">
    <button class="primary" id="startBtn">Start visit</button>
    <button class="ghost" id="resumeBtn" style="display:none">Resume</button>
    <button class="ghost" id="startEdit">Edit visit info</button>
  </div>
</section>

<div class="busywrap" id="busyWrap"><div id="busyText">Building report</div></div>

<script src="docx.umd.js"></script>
<script src="report.js"></script>
<script>
const BUILD = "v6";
const TAGS = ["Observation","Issue","Action","Safety"];
const DUES = ["Next visit","One week","Two weeks"];
const $ = s => document.querySelector(s);
let db, stream, track, visit = null;
let area = localStorage.getItem("area") || "";
let recent = JSON.parse(localStorage.getItem("recentAreas") || "[]");
let count = 0, busy = false, cur = null, lastId = null, undoTimer = null;
let nativeZoom = null, zoom = 1, maxZoom = 5;

/* ---------- storage ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("rdg-sitevisit", 2);
    r.onupgradeneeded = e => {
      const idb = e.target.result;
      if(!idb.objectStoreNames.contains("photos")){
        const s = idb.createObjectStore("photos",{keyPath:"id",autoIncrement:true});
        s.createIndex("ts","ts");
      }
      if(!idb.objectStoreNames.contains("visits")){
        idb.createObjectStore("visits",{keyPath:"id",autoIncrement:true});
      }
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = () => rej(r.error);
  });
}
const st = (n,m) => db.transaction(n,m).objectStore(n);
const putP  = r  => new Promise(res=>{ const q=st("photos","readwrite").put(r); q.onsuccess=()=>res(q.result); });
const allP  = () => new Promise(res=>{ const q=st("photos","readonly").getAll(); q.onsuccess=()=>res(q.result); });
const oneP  = id => new Promise(res=>{ const q=st("photos","readonly").get(id); q.onsuccess=()=>res(q.result); });
const dropP = id => new Promise(res=>{ const q=st("photos","readwrite").delete(id); q.onsuccess=()=>res(); });
const putV  = r  => new Promise(res=>{ const q=st("visits","readwrite").put(r); q.onsuccess=()=>res(q.result); });
const allV  = () => new Promise(res=>{ const q=st("visits","readonly").getAll(); q.onsuccess=()=>res(q.result); });

async function visitPhotos(){
  if(!visit) return [];
  const recs = await allP();
  return recs.filter(r => r.visitId === visit.id).sort((a,b)=>a.ts-b.ts);
}

/* ---------- visit lifecycle: start, capture, finish ---------- */
let pending = null;      /* an unfinished visit from a previous launch */
let nextNum = 1;

async function loadState(){
  const vs = (await allV()).sort((a,b)=>a.id-b.id);
  const last = vs[vs.length-1];
  nextNum = last ? last.num + 1 : 1;
  pending = vs.filter(v => !v.exported).pop() || null;
  if(pending) nextNum = pending.num;
  await paintStart();
}

async function paintStart(){
  const src = pending || (await lastVisit());
  $("#sProject").textContent = (src && src.project) ? src.project : "Not set";
  $("#sNum").textContent = "SVR " + String(nextNum).padStart(3,"0");
  $("#sDate").textContent = new Date().toLocaleDateString([], {month:"long", day:"numeric", year:"numeric"});
  $("#sBuild").textContent = BUILD;
  if(pending){
    const n = (await allP()).filter(r => r.visitId === pending.id).length;
    $("#resumeBtn").style.display = "block";
    $("#resumeBtn").textContent = "Resume SVR " + String(pending.num).padStart(3,"0")
      + " (" + n + (n === 1 ? " photo)" : " photos)");
    $("#startBtn").textContent = "Start a different visit";
  }else{
    $("#resumeBtn").style.display = "none";
    $("#startBtn").textContent = "Start visit";
  }
}
async function lastVisit(){
  const vs = (await allV()).sort((a,b)=>a.id-b.id);
  return vs[vs.length-1] || null;
}

async function newVisit(){
  const last = await lastVisit();
  const v = {
    num: last ? last.num + 1 : 1,
    date: Date.now(),
    started: Date.now(),
    project:   last ? last.project   : "",
    projNum:   last ? last.projNum   : "",
    attendees: last ? last.attendees : "",
    preparedBy:last ? last.preparedBy: "",
    weather: "", temp: "", exported: false
  };
  v.id = await putV(v);
  return v;
}

async function enterCapture(v){
  visit = v;
  if(!visit.started){ visit.started = Date.now(); await putV(visit); }

  /* photos taken before visits existed get adopted once */
  const orphans = (await allP()).filter(r => r.visitId == null);
  for(const o of orphans){ o.visitId = visit.id; await putP(o); }

  $("#start").classList.add("hide");
  await refreshCount();
  paintProj();
  fetchWeather();
  startCam();
}

async function backToStart(){
  visit = null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; track = null; }
  await loadState();
  $("#start").classList.remove("hide");
}

$("#startBtn").onclick = async () => { enterCapture(await newVisit()); };
$("#resumeBtn").onclick = async () => { if(pending) enterCapture(pending); };
$("#startEdit").onclick = async () => {
  /* editing before a visit exists: work on the pending one, or make it now */
  if(!visit) visit = pending || await newVisit();
  if(!pending) pending = visit;
  openVisitInfo();
};
$("#finishBtn").onclick = e => { e.stopPropagation(); openGal(); };

function paintProj(){
  if(!visit) return;
  const t = visit.started
    ? new Date(visit.started).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})
    : "";
  $("#projBtn").textContent = "SVR " + String(visit.num).padStart(3,"0") + (t ? "  " + t : "");
}

/* weather, silent, best effort */
function fetchWeather(){
  if(!visit || !navigator.geolocation || visit.weather) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    try{
      const la = pos.coords.latitude, lo = pos.coords.longitude;
      const u = "https://api.open-meteo.com/v1/forecast?latitude=" + la + "&longitude=" + lo
              + "&current=temperature_2m,weather_code&temperature_unit=fahrenheit";
      const j = await (await fetch(u)).json();
      visit.weather = wmo(j.current.weather_code);
      visit.temp = Math.round(j.current.temperature_2m) + " F";
      visit.lat = la; visit.lon = lo;
      await putV(visit);
    }catch(e){}
  }, () => {}, { timeout: 8000, maximumAge: 900000 });
}
function wmo(c){
  const m = {0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",
    51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",
    71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",82:"Heavy showers",
    95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
  return m[c] || "";
}

/* ---------- camera ---------- */
async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:2560}, height:{ideal:1440} }, audio:false });
    track = stream.getVideoTracks()[0];
    const v = $("#cam");
    v.srcObject = stream;
    await v.play().catch(()=>{});
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    nativeZoom = (caps.zoom && caps.zoom.max > caps.zoom.min) ? caps.zoom : null;
    maxZoom = nativeZoom ? Math.min(caps.zoom.max, 8) : 5;
    zoom = 1; buildZoomRow(); applyZoom();
    $("#stall").classList.remove("show");
  }catch(err){
    $("#stall").textContent = "Camera blocked. Tap to try again.";
    $("#stall").classList.add("show");
  }
}
setInterval(() => {
  if(document.hidden) return;
  if(!visit || !$("#start").classList.contains("hide")) return;
  if(document.querySelector(".sheet.open")) return;
  const v = $("#cam");
  const dead = !stream || !track || track.readyState !== "live" || v.paused || v.readyState < 2;
  if(dead){ v.play().catch(()=>{}); $("#stall").textContent = "Camera stalled. Tap to restart."; $("#stall").classList.add("show"); }
  else $("#stall").classList.remove("show");
}, 1500);
$("#stall").onclick = e => { e.stopPropagation(); startCam(); };
document.addEventListener("visibilitychange", () => {
  if(document.hidden || !visit) return;
  $("#cam").play().catch(()=>{});
  if(!stream || !track || track.readyState !== "live") startCam();
});

/* ---------- zoom ---------- */
function applyZoom(){
  zoom = Math.max(1, Math.min(maxZoom, zoom));
  if(nativeZoom && track){
    const span = nativeZoom.max - nativeZoom.min;
    const val = nativeZoom.min + span * (zoom - 1) / Math.max(0.001, maxZoom - 1);
    track.applyConstraints({ advanced:[{ zoom: val }] }).catch(()=>{});
    $("#cam").style.transform = "scale(1)";
  } else {
    $("#cam").style.transform = "scale(" + zoom + ")";
  }
  document.querySelectorAll(".zchip").forEach(c =>
    c.classList.toggle("on", Math.abs(parseFloat(c.dataset.z) - zoom) < 0.06));
}
function buildZoomRow(){
  const row = $("#zoomRow"); row.innerHTML = "";
  [1,2,3].filter(z => z <= maxZoom).forEach(z => {
    const b = document.createElement("button");
    b.className = "zchip"; b.dataset.z = z; b.textContent = z + "x";
    b.onclick = e => { e.stopPropagation(); zoom = z; applyZoom(); };
    row.appendChild(b);
  });
}
let pinchStart = 0, zoomStart = 1;
const wrap = $("#camwrap");
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
wrap.addEventListener("touchstart", e => { if(e.touches.length===2){ pinchStart=dist(e.touches); zoomStart=zoom; } }, {passive:true});
wrap.addEventListener("touchmove",  e => { if(e.touches.length===2 && pinchStart){ zoom = zoomStart*(dist(e.touches)/pinchStart); applyZoom(); } }, {passive:true});
wrap.addEventListener("touchend",   () => { pinchStart = 0; }, {passive:true});

/* ---------- capture ---------- */
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
const MAX = 1600;
function shoot(){
  const v = $("#cam");
  if(busy || !v.videoWidth || !visit) return;
  if($("#areaSheet").classList.contains("open")) return;
  busy = true;
  $("#shutter").classList.add("busy");
  $("#flash").classList.add("on");
  requestAnimationFrame(()=>$("#flash").classList.remove("on"));

  const ts = Date.now();
  const crop = nativeZoom ? 1 : zoom;
  const sw = v.videoWidth / crop, sh = v.videoHeight / crop;
  const sx = (v.videoWidth - sw) / 2, sy = (v.videoHeight - sh) / 2;
  const scale = Math.min(1, MAX / Math.max(sw, sh));
  canvas.width = Math.round(sw * scale);
  canvas.height = Math.round(sh * scale);
  ctx.drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  count++; paintCount();
  canvas.toBlob(async blob => {
    lastId = await putP({ visitId: visit.id, ts, blob, note:"", tag:"", area, sheet:"", owner:"", due:"" });
    setThumb(blob); showUndo();
    busy = false; $("#shutter").classList.remove("busy");
  }, "image/jpeg", 0.7);
}
wrap.addEventListener("click", e => { if(e.target.id === "cam" || e.target.id === "camwrap") shoot(); });
$("#shutter").addEventListener("click", e => { e.stopPropagation(); shoot(); });

function showUndo(){
  const u = $("#undo"); u.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>u.classList.remove("show"), 6000);
}
$("#undo").onclick = async e => {
  e.stopPropagation();
  if(lastId == null) return;
  await dropP(lastId); lastId = null;
  await refreshCount();
  $("#undo").classList.remove("show");
};
async function refreshCount(){
  const recs = await visitPhotos();
  count = recs.length; paintCount();
  if(recs.length) setThumb(recs[recs.length-1].blob);
  else { $("#thumb").style.backgroundImage=""; $("#thumb").classList.add("empty"); }
}
let thumbUrl = null;
function setThumb(blob){
  if(thumbUrl) URL.revokeObjectURL(thumbUrl);
  thumbUrl = URL.createObjectURL(blob);
  const t = $("#thumb");
  t.style.backgroundImage = "url(" + thumbUrl + ")";
  t.classList.remove("empty");
}
function paintCount(){
  const t = $("#thumb");
  let b = t.querySelector(".badge");
  if(!b){ b = document.createElement("span"); b.className="badge"; t.appendChild(b); }
  b.textContent = count; b.style.display = count ? "grid" : "none";
}

/* ---------- area ---------- */
function openArea(){
  $("#areaInput").value = area; drawRecent();
  $("#areaSheet").classList.add("open"); $("#scrim").classList.add("open");
  setTimeout(()=>$("#areaInput").focus(), 260);
}
function closeArea(save){
  if(save){
    area = $("#areaInput").value.trim();
    localStorage.setItem("area", area);
    if(area && recent.indexOf(area) === -1){
      recent.unshift(area); recent = recent.slice(0,8);
      localStorage.setItem("recentAreas", JSON.stringify(recent));
    }
    paintArea();
  }
  $("#areaInput").blur();
  $("#areaSheet").classList.remove("open"); $("#scrim").classList.remove("open");
  $("#cam").play().catch(()=>{});
}
function drawRecent(){
  const r = $("#areaRecent"); r.innerHTML = "";
  recent.forEach(a => {
    const b = document.createElement("button");
    b.className = "tag" + (a === area ? " on" : "");
    b.textContent = a;
    b.onclick = () => { $("#areaInput").value = a; closeArea(true); };
    r.appendChild(b);
  });
}
function paintArea(){ $("#areaBtn").textContent = area || "Set area"; }
$("#areaBtn").onclick = e => { e.stopPropagation(); openArea(); };
$("#areaDone").onclick = () => closeArea(true);
$("#scrim").onclick = () => closeArea(true);
$("#areaInput").addEventListener("keydown", e => { if(e.key === "Enter") closeArea(true); });

/* ---------- visit info ---------- */
$("#projBtn").onclick = e => { e.stopPropagation(); openVisitInfo(); };
function openVisitInfo(){
  $("#vProject").value = visit.project || "";
  $("#vNum").value = visit.projNum || "";
  $("#vAtt").value = visit.attendees || "";
  $("#vBy").value = visit.preparedBy || "";
  $("#vWx").value = visit.weather || "";
  $("#vTemp").value = visit.temp || "";
  $("#vAuto").textContent = "Report SVR " + String(visit.num).padStart(3,"0")
    + ". Date and time on site are filled in from your photos.";
  $("#vis").classList.add("open");
}
$("#visClose").onclick = () => $("#vis").classList.remove("open");
$("#visSave").onclick = async () => {
  visit.project = $("#vProject").value.trim();
  visit.projNum = $("#vNum").value.trim();
  visit.attendees = $("#vAtt").value.trim();
  visit.preparedBy = $("#vBy").value.trim();
  visit.weather = $("#vWx").value.trim();
  visit.temp = $("#vTemp").value.trim();
  await putV(visit);
  paintProj();
  await paintStart();
  $("#vis").classList.remove("open");
};
$("#vNew").onclick = async () => {
  $("#vis").classList.remove("open");
  await backToStart();
};

/* ---------- gallery ---------- */
let urls = [];
async function openGal(){
  const recs = await visitPhotos();
  urls.forEach(URL.revokeObjectURL); urls = [];
  const g = $("#grid"); g.innerHTML = "";
  $("#galEmpty").style.display = recs.length ? "none" : "block";
  $("#galTitle").textContent = "SVR " + String(visit.num).padStart(3,"0") + "   " + recs.length + " photos";
  $("#galBuild").disabled = !recs.length;
  $("#galExport").disabled = !recs.length;
  recs.forEach((r,i)=>{
    const u = URL.createObjectURL(r.blob); urls.push(u);
    const c = document.createElement("button");
    c.className = "cell" + (r.note || r.tag ? " noted" : "");
    c.style.backgroundImage = "url(" + u + ")";
    c.innerHTML = '<span class="n">' + String(i+1).padStart(3,"0") + '</span><span class="t">' + fmt(r.ts) + '</span>';
    c.onclick = () => openDet(r.id, i+1);
    g.appendChild(c);
  });
  $("#gal").classList.add("open");
}
const fmt = ts => new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
$("#thumb").addEventListener("click", e => { e.stopPropagation(); openGal(); });
$("#galClose").onclick = () => $("#gal").classList.remove("open");
$("#galBack").onclick  = () => $("#gal").classList.remove("open");
$("#galBuild").onclick = () => $("#galExport").click();

/* ---------- export ---------- */
let readyBlob = null, readyName = "";

$("#galExport").onclick = async () => {
  const recs = await visitPhotos();
  if(!recs.length) return;
  $("#busyText").textContent = "Building report from " + recs.length + " photos";
  $("#busyWrap").classList.add("show");
  try{
    readyBlob = await window.SVReport.buildReport(visit, recs);
    readyName = window.SVReport.reportFileName(visit);
    $("#busyWrap").classList.remove("show");
    $("#doneName").textContent = readyName;
    $("#doneNote").textContent = recs.length + " observations, "
      + Math.round(readyBlob.size / 1024) + " KB";
    $("#done").classList.add("open");
  }catch(err){
    $("#busyText").textContent = "Could not build the report: "
      + (err && err.message ? err.message : "unknown problem");
    setTimeout(()=>$("#busyWrap").classList.remove("show"), 6000);
  }
};

/* the send happens on its own tap so iOS still counts it as a user action */
$("#doneShare").onclick = async () => {
  if(!readyBlob) return;
  const file = new File([readyBlob], readyName,
    { type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: readyName });
      await markExported();
    }else{
      downloadReport();
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   /* he closed the share sheet */
    $("#doneNote").textContent = "Share was refused, saving to Files instead.";
    downloadReport();
  }
};
$("#doneSave").onclick = () => downloadReport();
function downloadReport(){
  if(!readyBlob) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(readyBlob);
  a.download = readyName;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  markExported();
}
async function markExported(){
  if(!visit) return;
  visit.exported = true;
  await putV(visit);
  $("#done").classList.remove("open");
  $("#gal").classList.remove("open");
  readyBlob = null;
  await backToStart();
}
$("#doneClose").onclick = () => $("#done").classList.remove("open");

/* ---------- detail ---------- */
async function openDet(id, n){
  cur = await oneP(id);
  $("#detTitle").textContent = "Observation " + String(n).padStart(3,"0");
  $("#detImg").src = URL.createObjectURL(cur.blob);
  $("#detMeta").textContent = new Date(cur.ts).toLocaleString([], {
    weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  $("#detNote").value = cur.note || "";
  $("#detArea").value = cur.area || "";
  $("#detSheet").value = cur.sheet || "";
  $("#detOwner").value = cur.owner || "";
  drawTags(cur.tag); drawDue(cur.due);
  $("#det").classList.add("open");
}
function drawTags(active){
  const row = $("#tagRow"); row.innerHTML = "";
  TAGS.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tag" + (t === active ? " on" : "");
    b.textContent = t;
    b.onclick = () => { cur.tag = (cur.tag === t ? "" : t); drawTags(cur.tag); };
    row.appendChild(b);
  });
  $("#actionBits").style.display = (active === "Issue" || active === "Action") ? "block" : "none";
}
function drawDue(active){
  const row = $("#dueRow"); row.innerHTML = "";
  DUES.forEach(d=>{
    const b = document.createElement("button");
    b.className = "tag" + (d === active ? " on" : "");
    b.textContent = d;
    b.onclick = () => { cur.due = (cur.due === d ? "" : d); drawDue(cur.due); };
    row.appendChild(b);
  });
}
$("#detClose").onclick = () => $("#det").classList.remove("open");
$("#detSave").onclick = async () => {
  cur.note = $("#detNote").value.trim();
  cur.area = $("#detArea").value.trim();
  cur.sheet = $("#detSheet").value.trim();
  cur.owner = $("#detOwner").value.trim();
  if(cur.area){
    area = cur.area; localStorage.setItem("area", area);
    if(recent.indexOf(area) === -1){
      recent.unshift(area); recent = recent.slice(0,8);
      localStorage.setItem("recentAreas", JSON.stringify(recent));
    }
    paintArea();
  }
  await putP(cur);
  $("#det").classList.remove("open");
  openGal();
};
$("#detDel").onclick = async () => {
  await dropP(cur.id);
  await refreshCount();
  $("#det").classList.remove("open");
  openGal();
};

(async function init(){
  db = await openDB();
  await loadState();
  paintArea();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
