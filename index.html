<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Site Visit">
<meta name="theme-color" content="#a12b2a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RDG Site Visit</title>
<style>
  :root{
    --red:#a12b2a;
    --ink:#101010;
    --paper:#f6f5f3;
    --line:rgba(255,255,255,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font:400 16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#fff;-webkit-user-select:none;user-select:none}

  /* ---------- capture ---------- */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .09s}
  #flash.on{opacity:.75;transition:none}

  .topbar{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
  .chip{border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;
    padding:7px 13px;border-radius:100px;font-size:13.5px;letter-spacing:.2px;backdrop-filter:blur(8px)}
  .chip:active{background:rgba(255,255,255,.2)}
  .count{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13.5px;opacity:.9}
  .count b{font-size:19px;font-weight:600}

  .dock{position:fixed;left:0;right:0;bottom:0;height:150px;
    padding:0 22px calc(env(safe-area-inset-bottom) + 14px);
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(0deg,rgba(0,0,0,.66),rgba(0,0,0,0))}

  #thumb{width:54px;height:54px;border-radius:11px;border:1.5px solid var(--line);
    background:#222 center/cover no-repeat;position:relative;flex:0 0 auto}
  #thumb.empty{opacity:.32}
  #thumb .badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;
    background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px}

  #shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:5px solid var(--red);
    box-shadow:0 0 0 3px rgba(0,0,0,.35);flex:0 0 auto}
  #shutter:active{transform:scale(.93)}
  #shutter.busy{background:#ddd}

  .spacer{width:54px;flex:0 0 auto}

  /* ---------- sheets ---------- */
  .sheet{position:fixed;inset:0;background:var(--paper);color:var(--ink);
    transform:translateY(100%);transition:transform .22s ease;overflow-y:auto;
    -webkit-overflow-scrolling:touch;z-index:20}
  .sheet.open{transform:translateY(0)}
  .sheethead{position:sticky;top:0;background:var(--paper);z-index:2;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;border-bottom:1px solid #dedbd6}
  .sheethead h2{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  .btn{border:0;background:none;color:var(--red);font-size:16px;font-weight:600;padding:6px 2px}
  .btn.right{margin-left:auto}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
  .cell{position:relative;aspect-ratio:1;background:#ddd center/cover no-repeat}
  .cell .t{position:absolute;left:0;right:0;bottom:0;padding:4px 5px;font-size:10.5px;color:#fff;
    background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);font-variant-numeric:tabular-nums}
  .cell .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;
    font-size:10.5px;padding:2px 5px;border-radius:4px}
  .cell.noted:after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;
    border-radius:50%;background:var(--red);box-shadow:0 0 0 1.5px #fff}

  .pad{padding:16px}
  .shot{width:100%;border-radius:10px;display:block;background:#ddd}
  .meta{font-size:13px;color:#6b6560;margin:10px 0 16px;font-variant-numeric:tabular-nums}
  textarea{width:100%;min-height:130px;border:1px solid #d5d1cb;border-radius:10px;padding:12px;
    font:inherit;background:#fff;color:var(--ink);resize:none}
  .lbl{font-size:12px;font-weight:700;letter-spacing:.9px;color:#7a736c;margin:18px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .tag{border:1px solid #d5d1cb;background:#fff;color:#3c3733;padding:9px 14px;border-radius:100px;font-size:14.5px}
  .tag.on{background:var(--red);border-color:var(--red);color:#fff}
  .danger{color:#a12b2a;border:1px solid #e3d4d3;background:#fff;width:100%;
    padding:14px;border-radius:10px;font:inherit;font-weight:600;margin:26px 0 40px}

  input[type=text]{width:100%;border:1px solid #d5d1cb;border-radius:10px;padding:13px;
    font:inherit;background:#fff;color:var(--ink)}

  .msg{position:fixed;inset:0;display:none;place-items:center;padding:30px;text-align:center;
    background:#000;z-index:40;font-size:15px;line-height:1.5}
  .msg.show{display:grid}
  .msg .btn{color:#fff;border:1px solid var(--line);border-radius:100px;padding:12px 22px;margin-top:18px}
  .empty{padding:60px 30px;text-align:center;color:#8a837c;font-size:15px}
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<div id="flash"></div>

<div class="topbar">
  <button class="chip" id="areaBtn">Set area</button>
  <div class="count"><b id="ct">0</b> photos</div>
</div>

<div class="dock">
  <button id="thumb" class="empty" aria-label="Review photos"></button>
  <button id="shutter" aria-label="Take photo"></button>
  <div class="spacer"></div>
</div>

<!-- gallery -->
<section class="sheet" id="gal">
  <div class="sheethead">
    <button class="btn" id="galClose">Camera</button>
    <h2 id="galTitle">Visit</h2>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="galEmpty" style="display:none">No photos yet.</div>
</section>

<!-- detail -->
<section class="sheet" id="det">
  <div class="sheethead">
    <button class="btn" id="detClose">Back</button>
    <h2 id="detTitle">Observation</h2>
    <button class="btn right" id="detSave">Save</button>
  </div>
  <div class="pad">
    <img class="shot" id="detImg" alt="">
    <div class="meta" id="detMeta"></div>
    <div class="lbl">NOTE</div>
    <textarea id="detNote" placeholder="Tap the microphone on your keyboard and talk."></textarea>
    <div class="lbl">TAG</div>
    <div class="chips" id="tagRow"></div>
    <div class="lbl">AREA</div>
    <input type="text" id="detArea" placeholder="Level 2, Exterior, Mech Room">
    <button class="danger" id="detDel">Delete this photo</button>
  </div>
</section>

<div class="msg" id="msg"><div><div id="msgText"></div><button class="btn" id="msgBtn">Try again</button></div></div>

<script>
const TAGS = ["Observation","Issue","Action","Safety"];
const $ = s => document.querySelector(s);
let db, stream, area = localStorage.getItem("area") || "", count = 0, busy = false, cur = null;

/* ---------- storage ---------- */
function open(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("rdg-sitevisit",1);
    r.onupgradeneeded = e => {
      const s = e.target.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});
      s.createIndex("ts","ts");
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode){ return db.transaction("photos",mode).objectStore("photos"); }
function put(rec){ return new Promise(res=>{ const r = tx("readwrite").put(rec); r.onsuccess=()=>res(r.result); }); }
function all(){ return new Promise(res=>{ const r = tx("readonly").getAll(); r.onsuccess=()=>res(r.result); }); }
function get(id){ return new Promise(res=>{ const r = tx("readonly").get(id); r.onsuccess=()=>res(r.result); }); }
function del(id){ return new Promise(res=>{ const r = tx("readwrite").delete(id); r.onsuccess=()=>res(); }); }
function countAll(){ return new Promise(res=>{ const r = tx("readonly").count(); r.onsuccess=()=>res(r.result); }); }

/* ---------- camera ---------- */
async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:2560}, height:{ideal:1440} },
      audio:false
    });
    $("#cam").srcObject = stream;
    $("#msg").classList.remove("show");
  }catch(err){
    $("#msgText").textContent =
      "Camera is not available. Allow camera access for this site, then try again. "
      + "On iPhone this needs to run over https.";
    $("#msg").classList.add("show");
  }
}

/* ---------- capture ---------- */
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
const MAX = 1600;

function shoot(){
  const v = $("#cam");
  if(busy || !v.videoWidth) return;
  busy = true;
  $("#shutter").classList.add("busy");
  $("#flash").classList.add("on");
  requestAnimationFrame(()=>$("#flash").classList.remove("on"));

  const ts = Date.now();
  const scale = Math.min(1, MAX / Math.max(v.videoWidth, v.videoHeight));
  canvas.width  = Math.round(v.videoWidth  * scale);
  canvas.height = Math.round(v.videoHeight * scale);
  ctx.drawImage(v,0,0,canvas.width,canvas.height);

  count++;
  paintCount();

  canvas.toBlob(async blob => {
    await put({ ts, blob, note:"", tag:"", area, seq:count });
    setThumb(blob);
    busy = false;
    $("#shutter").classList.remove("busy");
  }, "image/jpeg", 0.7);
}

let thumbUrl = null;
function setThumb(blob){
  if(thumbUrl) URL.revokeObjectURL(thumbUrl);
  thumbUrl = URL.createObjectURL(blob);
  const t = $("#thumb");
  t.style.backgroundImage = `url(${thumbUrl})`;
  t.classList.remove("empty");
}
function paintCount(){
  $("#ct").textContent = count;
  const t = $("#thumb");
  let b = t.querySelector(".badge");
  if(!b){ b = document.createElement("span"); b.className="badge"; t.appendChild(b); }
  b.textContent = count;
  b.style.display = count ? "grid" : "none";
}

/* ---------- gallery ---------- */
let urls = [];
async function openGal(){
  const recs = (await all()).sort((a,b)=>a.ts-b.ts);
  urls.forEach(URL.revokeObjectURL); urls = [];
  const g = $("#grid"); g.innerHTML = "";
  $("#galEmpty").style.display = recs.length ? "none" : "block";
  $("#galTitle").textContent = recs.length ? `${recs.length} photos` : "Visit";
  recs.forEach((r,i)=>{
    const u = URL.createObjectURL(r.blob); urls.push(u);
    const c = document.createElement("button");
    c.className = "cell" + (r.note || r.tag ? " noted" : "");
    c.style.backgroundImage = `url(${u})`;
    c.innerHTML = `<span class="n">${String(i+1).padStart(3,"0")}</span>`
                + `<span class="t">${fmt(r.ts)}</span>`;
    c.onclick = () => openDet(r.id, i+1);
    g.appendChild(c);
  });
  $("#gal").classList.add("open");
}
function fmt(ts){
  return new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}

/* ---------- detail ---------- */
async function openDet(id, n){
  cur = await get(id);
  $("#detTitle").textContent = "Observation " + String(n).padStart(3,"0");
  $("#detImg").src = URL.createObjectURL(cur.blob);
  $("#detMeta").textContent = new Date(cur.ts).toLocaleString([], {
    weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  $("#detNote").value = cur.note || "";
  $("#detArea").value = cur.area || "";
  drawTags(cur.tag);
  $("#det").classList.add("open");
}
function drawTags(active){
  const row = $("#tagRow"); row.innerHTML = "";
  TAGS.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tag" + (t===active ? " on" : "");
    b.textContent = t;
    b.onclick = () => { cur.tag = (cur.tag===t ? "" : t); drawTags(cur.tag); };
    row.appendChild(b);
  });
}

/* ---------- wiring ---------- */
$("#shutter").addEventListener("click", shoot);
$("#thumb").addEventListener("click", openGal);
$("#galClose").onclick = () => $("#gal").classList.remove("open");
$("#detClose").onclick = () => $("#det").classList.remove("open");

$("#detSave").onclick = async () => {
  cur.note = $("#detNote").value.trim();
  cur.area = $("#detArea").value.trim();
  if(cur.area){ area = cur.area; localStorage.setItem("area", area); paintArea(); }
  await put(cur);
  $("#det").classList.remove("open");
  openGal();
};
$("#detDel").onclick = async () => {
  if(!confirm("Delete this photo?")) return;
  await del(cur.id);
  count = await countAll(); paintCount();
  $("#det").classList.remove("open");
  openGal();
};
$("#areaBtn").onclick = () => {
  const v = prompt("Area for the next photos", area);
  if(v === null) return;
  area = v.trim(); localStorage.setItem("area", area); paintArea();
};
function paintArea(){ $("#areaBtn").textContent = area || "Set area"; }
$("#msgBtn").onclick = startCam;

/* keep the stream alive when returning from the home screen */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && (!stream || !stream.active)) startCam();
});

(async function init(){
  db = await open();
  count = await countAll();
  paintCount(); paintArea();
  const recs = await all();
  if(recs.length) setThumb(recs.sort((a,b)=>a.ts-b.ts).at(-1).blob);
  startCam();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
